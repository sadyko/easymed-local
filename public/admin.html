<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <!-- NO_BROWSER_TRANSLATE_V1 — this is a Russian-language clinical app. Chrome saw
         lang="en" + Cyrillic content and auto-translated the page, which rewrites the
         hand-built DOM: it garbled labels (service names collapsed to their code) and
         broke input/save handlers so techs couldn't type or save results. Machine-
         translating a medical app (units, flags, drug names) is unsafe anyway. The app
         has its own UZ/RU/EN switcher for real localization.
         Ported from production easymed.uz, where this exact bug was diagnosed and fixed;
         this local build had never received it. -->
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy-Med · Admin</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=blue1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#24426f">
    <link rel="apple-touch-icon" href="/icon-192.png?v=blue1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EasyMed">
    <link rel="stylesheet" href="css/admin.css?v=topnav1">
    <link rel="stylesheet" href="css/admin-views.css?v=rh4">
    <link rel="stylesheet" href="css/login-stage.css">
</head>
<body class="admin">
    <!-- SHELL_REGIONS_V1 (2026-09-05, владелец: «can we make top section and
         the left panel separate? with constant design across all the
         modules») — ДВЕ ОБЛАСТИ, И ЭТО ВИДНО В РАЗМЕТКЕ.

         data-region — не украшение: это единственное место, где «левая
         колонка» и «область содержимого» названы вслух, и тест оболочки
         проверяет по ним ИМЕННО СТРУКТУРУ (верхняя строка лежит внутри
         области содержимого и НЕ внутри колонки), а не то, как это
         выглядит. Пока верхняя строка была визуально прижата к знаку
         клиники, спорить было не о чем: разметка и картинка расходились.

         Геометрия обеих областей — в admin.css (SHELL_REGIONS_V1): зазор
         грунта между ними, свой край и свой верхний левый угол у области
         содержимого. -->
    <!-- DEPT_TOPNAV_V1 (2026-11-21) — РАЗДЕЛЫ СВЕРХУ, ФУНКЦИИ СЛЕВА.
         Верхняя полоса (data-region="departments"): знак и имя клиники, затем
         разделы — это заголовки групп NAV (admin.js), а не новый список.
         Левая колонка (data-region="rail") — прежняя колонка меню, теперь
         с функциями ОДНОГО раздела: того, которому принадлежит открытый
         маршрут. Оба выделения считаются из маршрута, поэтому F5, прямая
         ссылка и «Назад/Вперёд» показывают верный раздел и верную функцию.
         На узком экране колонка — выдвижная панель слева (#rail-open). -->
    <div class="app">
        <!-- ============ TOP BAR — бренд + разделы ============ -->
        <header class="deptbar" data-region="departments">
            <div class="deptbar-brand">
                <div class="brand-mark" id="sidebar-logo" aria-hidden="true">
                    <!-- BRAND_TILE_BLUE_V1 (2026-10-31) — знак Easy-Med (тот же пульс,
                         что в favicon.svg) вместо прежнего «+». Знак всегда Easy-Med:
                         логотип клиники сюда больше не ставится, от клиники в шапке
                         остаётся только название (.brand-sub). -->
                    <svg viewBox="2 2 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17 L10 17 L12 10 L14.5 24 L17 13 L19 17 L27 17"/>
                    </svg>
                </div>
                <!-- BRAND_PLATE_V1 (2026-09-05) — порядок строк перевёрнут: имя
                     КЛИНИКИ первым, имя поставщика подписью под ним (тот же
                     маркер в admin.css объясняет почему). .brand-sub оставлена
                     ПУСТОЙ: admin.js кладёт в неё clinic.name, когда определит
                     клинику, а прежняя заглушка «HIS» до этого момента стояла
                     бы на месте имени клиники — и осталась бы там навсегда,
                     если бы клиника не определилась. -->
                <div class="brand-text">
                    <div class="brand-sub"></div>
                    <div class="brand-name">Easy<span class="dot">·</span>Med</div>
                </div>
            </div>
            <!-- Populated by renderSectionTabs() in js/admin.js -->
            <nav id="dept-nav" class="dept-nav" aria-label="Разделы"></nav>
            <!-- CONTROLS_IN_DEPTBAR_V1 (2026-11-21, владелец: «put all of this to
                 top place as there is enough space») — органы управления
                 (телефон, обновить, колокольчик, филиал, язык, учётная запись)
                 переехали из строки экрана в полосу разделов, справа. Ids прежние:
                 их владельцы (notifications.js → #topbar-bell, branch-picker.js →
                 #branch-picker, crm-phone.js ставит «Телефон» перед
                 #topbar-reload, admin.js → остальное) находят их по id, а не по
                 месту. В строке экрана остались только «назад» и имя раздела. -->
            <div class="appbar-controls">
                <!-- APP_RELOAD_BTN_V1 — reload the app (handy in standalone/app mode where the browser reload is hidden) -->
                <button id="topbar-reload" class="appbar-reload" type="button" title="Обновить приложение" aria-label="Обновить приложение">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
                <div class="topbar-bell" id="topbar-bell"></div>
                <div id="branch-picker" class="branch-picker"></div>
                <!-- LANG_DROPDOWN_V1 (2026-11-21, владелец: «make language as a
                     dropdown») — три кнопки UZ/RU/EN свёрнуты в одну: текущий код
                     и ▾, по нажатию — список. Кнопки языков остались теми же
                     button[data-lang] (admin.js → wireLangSwitcher). -->
                <div class="topbar-lang" id="topbar-lang">
                    <button type="button" class="lang-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Language"><span class="lang-cur">RU</span><span class="lang-caret" aria-hidden="true">▾</span></button>
                    <div class="lang-pop" role="menu" hidden>
                        <button type="button" role="menuitem" data-lang="uz">UZ</button>
                        <button type="button" role="menuitem" data-lang="ru">RU</button>
                        <button type="button" role="menuitem" data-lang="en">EN</button>
                    </div>
                </div>
                <div id="user-card-wrap" class="user-card-wrap">
                    <button id="user-card-btn" class="user-card user-card--topbar" type="button" aria-haspopup="true" aria-expanded="false">
                        <div class="avatar" id="user-avatar">?</div>
                        <div class="user-card-text">
                            <div class="user-name" id="user-name">—</div>
                            <div class="user-role" id="user-role">—</div>
                        </div>
                        <span class="user-card-chev">▾</span>
                    </button>
                    <div id="user-popover" class="user-popover" hidden></div>
                </div>
            </div>
            <!-- Узкий экран: открывает колонку функций выдвижной панелью. -->
            <button id="rail-open" class="deptbar-menu" type="button" aria-controls="app-rail" aria-expanded="false" title="Меню раздела" aria-label="Меню раздела">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </header>

        <!-- ============ LEFT PANEL — функции выбранного раздела ============ -->
        <aside class="sidebar" id="app-rail" data-region="rail" aria-label="Функции раздела">
            <div class="rail-head">
                <h2 id="rail-title" class="rail-title"></h2>
                <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="app-rail" aria-expanded="true" title="Свернуть меню" aria-label="Свернуть меню">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>

            <!-- Populated by renderSidebar() in js/admin.js -->
            <nav id="sidebar-body" class="sidebar-body" aria-labelledby="rail-title"></nav>
        </aside>
        <div class="rail-scrim" id="rail-scrim" hidden></div>

        <!-- ============ CONTENT REGION — своя верхняя строка + экран ============ -->
        <main class="main" data-region="content">
            <!-- NO_TABS_APPBAR_V1 (2026-09-05, owner: «remove this shitty tabs.
                 completely») — the browser-style tab strip is gone. What is left
                 is a bar of pure CHROME: the section title on the left (the tab
                 labels were carrying screen identity until now) and the global
                 controls on the right, which all kept their ids so their owners
                 (notifications.js → #topbar-bell, branch-picker.js →
                 #branch-picker, admin.js → the rest) are untouched. -->
            <header id="topbar" class="appbar" data-region-part="head">
                <!-- APPBAR_BACK_V1 — один способ вернуться, в одном месте.
                     Кнопка живёт в ОБОЛОЧКЕ, а не в экранах: экран очищает свой
                     контейнер при каждой перерисовке и унёс бы её с собой, и
                     тридцать экранов рисовали бы тридцать разных «назад». -->
                <button id="section-back" class="appbar-back" type="button" hidden=""></button>
                <h1 id="section-title" class="appbar-title">—</h1>
                <!-- CONTROLS_IN_DEPTBAR_V1 — органы управления теперь в полосе разделов (выше). -->
            </header>

            <!-- View root — every page renders here via renderView() -->
            <div id="view-root" class="view-root">
                <div class="empty" style="padding: 60px;">Loading…</div>
            </div>
        </main>
    </div>

    <script type="module" src="js/admin.js?v=topnav1"></script>
    <!-- SUPPORT_FAB_REMOVED_V1 — плавающая кнопка поддержки убрана. Чат всё
         равно был нерабочим: он читает support_tickets / support_messages,
         которых в локальной сборке нет (ни таблиц, ни записей в реестре) —
         остаток SaaS-версии. Сам js/admin/support-widget.js оставлен на диске:
         чтобы вернуть кнопку, достаточно раскомментировать эту строку.
    <script type="module" src="js/admin/support-widget.js?v=fab1"></script>
    -->
    <script type="module" src="js/admin/onboarding.js?v=3"></script>
</body>
</html>
