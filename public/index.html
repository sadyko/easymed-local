<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy-Med — Login</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/local.css">
</head>
<body>
  <div class="center-screen">
    <form class="card" id="login-form">
      <h1 class="brand">Easy-<span>Med</span></h1>
      <p class="sub">Clinic management system</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error"></p>
      <button class="full" type="submit">Sign in</button>
    </form>
    <!-- FIRST_RUN_PASSWORD_V1: shown instead of the login card when the signed-in
         user still carries the first-run default password. The server refuses
         every other API call until this succeeds, so there is no way around it
         by just navigating away. -->
    <form class="card" id="newpass-form" hidden>
      <h1 class="brand">Easy-<span>Med</span></h1>
      <p class="sub">Set a new password before continuing</p>
      <label for="new-password">New password (8+ characters)</label>
      <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="new-password2">Repeat new password</label>
      <input id="new-password2" name="new_password2" type="password" autocomplete="new-password" minlength="8" required>
      <p class="error" id="newpass-error"></p>
      <button class="full" type="submit">Save and continue</button>
    </form>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
